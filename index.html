<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelishome</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-mark">PELISHOME</span>
          <h1>Pelishome</h1>
          <p>Películas y series en una experiencia visual inmersiva.</p>
        </div>
        <div class="top-actions">
          <button id="go-catalog" class="nav-pill active" type="button">Explorar catálogo</button>
          <button id="go-player" class="nav-pill" type="button">Ir al reproductor</button>
        </div>
      </header>

      <main>
        <section class="hero" aria-label="Contenido destacado">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="eyebrow">Destacado de hoy</span>
            <h2 id="featured-title">Pelishome en modo cine</h2>
            <p id="featured-description">Explora el catálogo y reproduce películas o series al instante.</p>
            <div class="hero-actions">
              <button id="featured-play" class="primary-action" type="button">Reproducir destacado</button>
              <button id="featured-explore" class="secondary-action" type="button">Explorar catálogo</button>
            </div>
          </div>
        </section>

        <section id="catalog-section" class="content-panel">
          <div class="section-header">
            <div>
              <span class="section-kicker">Catálogo</span>
              <h2>Elige qué ver ahora</h2>
            </div>
            <div class="tabs" role="tablist" aria-label="Filtro de catálogo">
              <button class="tab active" data-type="movie" type="button">Películas</button>
              <button class="tab" data-type="tv" type="button">Series</button>
            </div>
          </div>

          <div id="catalog-viewport" class="catalog-carousel-wrap">
            <button
              id="catalog-prev"
              class="catalog-nav catalog-nav-prev"
              type="button"
              aria-label="Desplazar catálogo a la izquierda"
              hidden
            >
              &#10094;
            </button>
            <ul id="catalog-list" class="catalog-carousel"></ul>
            <button
              id="catalog-next"
              class="catalog-nav catalog-nav-next"
              type="button"
              aria-label="Desplazar catálogo a la derecha"
              hidden
            >
              &#10095;
            </button>
          </div>
        </section>

        <section id="player-section" class="player-panel">
          <div class="section-header compact">
            <div>
              <span class="section-kicker">Reproductor</span>
              <h2>Ahora viendo</h2>
            </div>
          </div>
          <p id="player-title" class="player-title">Selecciona un contenido para reproducir.</p>
          <iframe
            id="player"
            title="Reproductor Vidking"
            allow="autoplay; fullscreen"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
